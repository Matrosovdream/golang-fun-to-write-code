services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gobank
      POSTGRES_PASSWORD: gobank
      POSTGRES_DB: gobank
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobank"]
      interval: 2s
      timeout: 2s
      retries: 15
